<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f2f2f2;
      transition: background-color 0.3s ease;
    }

    .marquee {
      background-color: #111;
      color: white;
      padding: 10px;
      font-weight: bold;
      overflow: hidden;
      position: relative;
    }

    .marquee span {
      display: inline-block;
      white-space: nowrap;
      animation: scroll-left 10s linear infinite;
    }

    @keyframes scroll-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }

    .calculator {
      background-color: #222;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .display {
      background: black;
      color: lime;
      font-size: 2rem;
      height: 60px;
      text-align: right;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      gap: 10px;
    }

    .btn {
      height: 60px;
      font-size: 1.5rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:hover {
      transform: scale(1.05);
    }

    .btn.red { background-color: #e74c3c; color: white; }
    .btn.blue { background-color: #007bff; color: white; }
    .btn.green { background-color: #2ecc71; color: white; }
    .btn.gray { background-color: #444; color: white; }

    .mode-btn {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
    }

    .dark-mode {
      background-color: #121212;
    }

    /* Modal styling */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      animation: fadeIn 0.5s ease;
    }
    .modal-content img {
      max-width: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    .modal-content h2 {
      margin: 10px 0;
    }
    .modal-content button {
      margin-top: 20px;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="marquee"><span>Made By - Ishaan Srivastava</span></div>

  <div class="container">
    <div class="calculator">
      <div class="display" id="calcDisplay"></div>
      <div class="buttons">
        <button class="btn red" onclick="clearInput()">C</button>
        <button class="btn blue" onclick="appendToInput('/')">/</button>
        <button class="btn blue" onclick="appendToInput('*')">*</button>
        <button class="btn blue" onclick="appendToInput('-')">-</button>

        <button class="btn gray" onclick="appendToInput('7')">7</button>
        <button class="btn gray" onclick="appendToInput('8')">8</button>
        <button class="btn gray" onclick="appendToInput('9')">9</button>
        <button class="btn blue" onclick="appendToInput('+')">+</button>

        <button class="btn gray" onclick="appendToInput('4')">4</button>
        <button class="btn gray" onclick="appendToInput('5')">5</button>
        <button class="btn gray" onclick="appendToInput('6')">6</button>
        <button class="btn green" onclick="computeResult()">=</button>

        <button class="btn gray" onclick="appendToInput('1')">1</button>
        <button class="btn gray" onclick="appendToInput('2')">2</button>
        <button class="btn gray" onclick="appendToInput('3')">3</button>
        <button class="btn gray" onclick="appendToInput('0')">0</button>
      </div>
    </div>
    <button class="mode-btn" onclick="toggleTheme()">Switch to Dark Mode</button>
  </div>

  <!-- Welcome Modal -->
  <div class="modal" id="welcomeModal">
    <div class="modal-content">
      <img src="IMG-20231217-WA0017.jpg" alt="Ishaan Srivastava">
      <h2>Welcome!</h2>
      <p>This calculator is proudly created by Ishaan Srivastava.</p>
      <button onclick="closeWelcomeModal()">Continue</button>
    </div>
  </div>

  <!-- Mode Switch Modal -->
  <div class="modal" id="modeModal" style="display:none;">
    <div class="modal-content">
      <h2 id="modeMessage">Mode Changed</h2>
      <button onclick="closeModeSwitchModal()">OK</button>
    </div>
  </div>

  <script>
    // Initializing necessary variables
    let calcDisplay = document.getElementById('calcDisplay');
    let currentInput = '';
    let isDarkMode = false;

    // Function to append value to input string
    function appendToInput(value) {
      currentInput += value;
      calcDisplay.innerText = currentInput;
    }

    // Function to clear the input
    function clearInput() {
      currentInput = '';
      calcDisplay.innerText = '';
    }

    // Function to evaluate and display result
    function computeResult() {
      try {
        currentInput = eval(currentInput).toString();
        calcDisplay.innerText = currentInput;
      } catch (error) {
        calcDisplay.innerText = 'Error';
        currentInput = '';
      }
    }

    // Toggle between light and dark modes
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      isDarkMode = !isDarkMode;
      document.querySelector('.mode-btn').innerText = isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode';
      document.getElementById('modeMessage').innerText = isDarkMode ? 'Dark Mode Activated' : 'Light Mode Activated';
      document.getElementById('modeModal').style.display = 'flex';
    }

    // Close welcome modal
    function closeWelcomeModal() {
      document.getElementById('welcomeModal').style.display = 'none';
    }

    // Close mode switch modal
    function closeModeSwitchModal() {
      document.getElementById('modeModal').style.display = 'none';
    }

    // Show welcome modal when page loads
    window.onload = function() {
      document.getElementById('welcomeModal').style.display = 'flex';
    };
  </script>
</body>
</html>
